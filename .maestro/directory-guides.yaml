appId: ml.sossecurite.app
name: Annuaire et guides hors ligne
---
- launchApp:
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Votre dossier d'urgence"
    commands:
      - tapOn: "Accéder au SOS sans dossier"
- tapOn: "Numéros"
- assertVisible: "Numéros utiles"
- assertVisible: "122"
- assertVisible: "Protection Civile"
- back
- tapOn: "Guides"
- assertVisible: "Gestes qui sauvent"
- tapOn: "Réanimation cardio-pulmonaire, 7 étapes"
- assertVisible: "Étape 1 sur 7"
- assertVisible: "Écouter cette étape"
