appId: ml.sossecurite.app
name: Premier démarrage et routage SOS
# Efface uniquement l'app sur un appareil de QA dédié, jamais un dossier réel.
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "Votre dossier d'urgence"
- tapOn: "Accéder au SOS sans dossier"
- assertVisible: "SOS Sécurité Mali"
- tapOn: "Déclencher un SOS"
- assertVisible: "Quel type d'urgence ?"
- tapOn: "Agression"
- assertVisible: "Appeler le 101"
- tapOn: "Continuer le SOS sans position"
- assertVisible: "Position non ajoutée"
- scrollUntilVisible:
    element: "Ouvrir le SMS de secours"
    direction: DOWN
- assertVisible: "Appeler le 101"
