appId: ml.sossecurite.app
name: Consentements carte et confidentialité
---
- launchApp:
    permissions:
      all: deny
- runFlow:
    when:
      visible: "Votre dossier d'urgence"
    commands:
      - tapOn: "Accéder au SOS sans dossier"
- tapOn: "Lieux"
- assertVisible: "Voir les lieux les plus proches"
- tapOn: "Continuer avec le centre de Bamako"
- scrollUntilVisible:
    element: "CHU Gabriel Touré"
    direction: DOWN
- tapOn: "Accueil"
- tapOn: "Réglages"
- scrollUntilVisible:
    element: "Ouvrir confidentialité et contrôle des données"
    direction: DOWN
- tapOn: "Ouvrir confidentialité et contrôle des données"
- assertVisible: "Vos données médicales restent sur ce téléphone"
- scrollUntilVisible:
    element: "Effacer toutes mes données"
    direction: DOWN
